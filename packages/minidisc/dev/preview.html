<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>MiniDisc presets</title>
  <link rel="stylesheet" href="./fonts.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #07070C; color: #F5F1E6; font-family: 'Inter', sans-serif; }
    #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
    .bar { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
           font: 600 11px/1 'JetBrains Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(245,241,230,0.66); }
    .bar button, .bar select { font: inherit; letter-spacing: inherit; text-transform: inherit; color: #F5F1E6; background: #1A1A1A;
           border: 1px solid rgba(253,185,19,0.22); padding: 10px 14px; min-height: 40px; cursor: pointer; }
    .bar button:hover { border-color: rgba(253,185,19,0.6); }
    #status { color: #FDB913; }
    #sheet { position: fixed; right: 16px; top: 16px; width: 256px; image-rendering: auto; background: repeating-conic-gradient(#222 0 25%, #111 0 50%) 0 0 / 16px 16px; border: 1px solid rgba(253,185,19,0.22); display: none; }
    .labels { position: fixed; left: 0; right: 0; top: 14px; display: flex; justify-content: center; gap: 0; pointer-events: none;
              font: 600 11px/1 'JetBrains Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(245,241,230,0.66); }
  </style>
  <!-- ?design=blood|reflections|let-him-cook picks the sample art (default blood); ?sleeve shows the sample sleeved; ?edition=N stamps it. -->
  <script type="module" src="./preview.ts"></script>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="labels" id="labels"></div>
  <img id="sheet" alt="Sprite sheet" />
  <div class="bar">
    <span id="status">BOOTING</span>
    <select id="design"><option>blood</option><option>reflections</option><option>let-him-cook</option></select>
    <button id="mode">MODE: PRESETS</button>
    <button id="loop">RENDER SPIN LOOP → shots/</button>
    <button id="wear">WEAR 0.6</button>
  </div>
</body>
</html>
