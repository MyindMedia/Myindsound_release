<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07070C" />
  <title>LIT | Myind Sound — pay what you want</title>
  <meta name="description"
    content="LIT by Myind Sound. Peel the wrapper, load the MiniDisc and listen. Previews for everyone, the full album for whatever you want to pay." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <!-- Site styles (cards, buttons, checkout modal); the player's own CSS is imported by home.ts. -->
  <link rel="stylesheet" href="/style.css" />
  <link rel="preload" as="image" href="/assets/images/lit-sleeve.webp" type="image/webp" />
  <link rel="preload" as="image" href="/assets/images/minidisc/body.webp" type="image/webp" />
  <style>
    html, body { margin: 0; background: #07070C; }
  </style>
</head>

<body class="stream-page home-page">
  <nav class="main-nav" aria-label="Site">
    <div class="nav-links">
      <a href="/" class="active" aria-current="page">LISTEN</a>
      <a href="/physical">PHYSICAL</a>
      <a href="/dashboard">DASHBOARD</a>
      <a href="/login">GET ACCESS</a>
    </div>
  </nav>

  <!-- Wrapped MiniDisc + 3D deck + HUD (src/player3d) -->
  <main id="player-root" class="p3d--inline" aria-label="LIT MiniDisc player"></main>

  <div class="home-below">
    <section class="coming-soon-section container">
      <header class="section-header">
        <span class="section-label">COMING SOON</span>
      </header>
      <div class="coming-soon-grid">
        <div class="coming-soon-card" tabindex="0" data-poster="/assets/images/cwalk-poster.png"
          data-audio-src="/assets/audio/Blood-Demo.mp3" data-audio-start="15" data-audio-duration="20">
          <div class="card-media">
            <div class="poster-group" data-peel-hover="20" data-peel-active="70" data-peel-direction="269"
              data-lighting="0.09" data-shadow="0.05" data-rotate="0">
              <div class="poster-layer"></div>
            </div>
            <div class="plastic-top"></div>
            <div class="plastic-bottom"></div>
            <video src="/assets/videos/c-walk-loop.mp4" poster="/assets/images/cwalk-poster.png"
              alt="C-WALK album cover" class="card-video" loop muted playsinline webkit-playsinline
              preload="none"></video>
          </div>
          <p class="card-title">C-WALK</p>
          <button class="card-play-btn" type="button" aria-label="Play demo" style="display: none;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="card-play-icon">
              <path d="M8 5v14l11-7z" />
            </svg>
          </button>
        </div>
        <div class="coming-soon-card" tabindex="0" data-poster="/assets/images/thesource-poster.png"
          data-audio-src="/assets/audio/God-is-Good-Demo.mp3" data-audio-start="140" data-audio-duration="20">
          <div class="card-media">
            <div class="poster-group" data-peel-hover="20" data-peel-active="70" data-peel-direction="269"
              data-lighting="0.09" data-shadow="0.05" data-rotate="0">
              <div class="poster-layer"></div>
            </div>
            <div class="plastic-top"></div>
            <div class="plastic-bottom"></div>
            <video src="/assets/videos/the-source-loop.mp4" poster="/assets/images/thesource-poster.png"
              alt="The Source album cover" class="card-video" loop muted playsinline webkit-playsinline
              preload="none"></video>
          </div>
          <p class="card-title">THE SOURCE</p>
          <button class="card-play-btn" type="button" aria-label="Play demo" style="display: none;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="card-play-icon">
              <path d="M8 5v14l11-7z" />
            </svg>
          </button>
        </div>
      </div>
    </section>

    <section class="home-cta container">
      <h2>WANT IT PHYSICAL?</h2>
      <p>Limited MiniDisc pressings and merch from the LIT run.</p>
      <a class="primary-btn" href="/physical">VISIT THE STORE</a>
    </section>
  </div>

  <!-- Pay-what-you-want checkout -->
  <div id="checkout-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <button id="close-modal" class="close-btn">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
  <script type="module" src="/src/home.ts"></script>
  <script type="module" src="/src/coming-soon.ts"></script>
</body>

</html>
