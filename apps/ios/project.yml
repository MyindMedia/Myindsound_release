# Myind Sound iOS app (PRD §20 apps/ios). Generate with `/opt/homebrew/bin/xcodegen generate` from this folder.
# Design tokens and fonts are referenced from packages/tokens (DS-6, DS-33): never copied here.
name: MyindSound
options:
  bundleIdPrefix: com.myindsound
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    # Lawrence Berment (paid individual team). Automatic signing for the app and the test bundle.
    DEVELOPMENT_TEAM: SCFGWPBXMF
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configFiles:
  # CONVEX_URL + CLERK_PUBLISHABLE_KEY (AUTH-1); Config/Dev.xcconfig (gitignored) overrides the defaults.
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
packages:
  # Swift port of the wear model (P7). Local package; built with `swift build` on 2026-09-25.
  MyindWear:
    path: ../../packages/wear-swift
  # AUTH-1: Clerk iOS SDK (ClerkKit only; the sign in form is our own HUD panel, PRD 4A.9 fallback).
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: "1.5.7"
  # Convex Swift client. Auth goes through our own AuthProvider (the "convex" JWT template), not
  # clerk-convex-swift, which asks Clerk for the default session token.
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: "0.8.1"
targets:
  MyindSound:
    type: application
    platform: iOS
    sources:
      - path: MyindSound
        excludes:
          - "Info.plist"
      # DS-33: the generated Theme.swift lives in the tokens package and is compiled in place.
      - path: ../../packages/tokens/dist/Theme.swift
        group: Tokens
      # DS-7: Inter + JetBrains Mono (OFL) bundled from the tokens package; Info.plist UIAppFonts lists them.
      - path: ../../packages/tokens/fonts/inter
        group: Tokens/Fonts
        type: folder
        buildPhase: resources
      - path: ../../packages/tokens/fonts/jetbrains-mono
        group: Tokens/Fonts
        type: folder
        buildPhase: resources
      # CONTRACT.md §2: the bridge shim is injected exactly as the web side ships it (never copied here).
      - path: ../../packages/bridge/native-shim.js
        group: Bridge
        buildPhase: resources
    info:
      path: MyindSound/Info.plist
      properties:
        CFBundleDisplayName: Myind Sound
        CFBundleName: Myind Sound
        # 1.0.0: release bundles declare minAppVersion (BRG-3); LIT 1.0.0 needs 1.0.0.
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        # DS-3: dark only.
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
        # AUD-7: music keeps playing with the screen locked.
        UIBackgroundModes:
          - audio
        # Read by AppConfig.swift; values come from Config/App.xcconfig (+ Dev.xcconfig).
        MSConvexURL: $(CONVEX_URL)
        MSClerkPublishableKey: $(CLERK_PUBLISHABLE_KEY)
        # Folder references keep their directory inside the bundle, so the paths carry it.
        UIAppFonts:
          - inter/Inter-Regular.ttf
          - inter/Inter-Medium.ttf
          - inter/Inter-SemiBold.ttf
          - inter/Inter-ExtraBold.ttf
          - jetbrains-mono/JetBrainsMono-Medium.ttf
          - jetbrains-mono/JetBrainsMono-SemiBold.ttf
          - jetbrains-mono/JetBrainsMono-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myindsound.app
        PRODUCT_NAME: MyindSound
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # DS-3: gold app tint, never system blue.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        SUPPORTS_MACCATALYST: NO
    postBuildScripts:
      # Debug only: embed the built release bundles (dist-bundles/<slug>/ plus the published zip and manifest)
      # as DevBundles/, so the simulator opens them with no hosting. Skipped when dist-bundles doesn't exist
      # (run `npm run bundle:lit` first) and always in Release.
      - name: Embed dev release bundles
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../../dist-bundles
        script: |
          set -e
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          SRC="$SRCROOT/../../dist-bundles"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/DevBundles"
          rm -rf "$DST"
          [ -d "$SRC" ] || { echo "note: no dist-bundles; the app has no dev release bundles"; exit 0; }
          mkdir -p "$DST"
          for dir in "$SRC"/*; do [ -f "$dir/manifest.json" ] && cp -R "$dir" "$DST/"; done
          cp "$SRC"/*.zip "$SRC"/*.manifest.json "$DST/" 2>/dev/null || true
          echo "embedded $(ls "$DST" | wc -l | tr -d ' ') dev bundle files"
    dependencies:
      - package: MyindWear
        product: MyindWear
      - package: Clerk
        product: ClerkKit
      - package: ConvexMobile
        product: ConvexMobile
    # Room for the widget + Live Activity extensions (PRD §14, DS-22 font): add `MyindSoundWidgets`
    # (type: app-extension, platform: iOS, entitlements for ActivityKit) here as a second target and a
    # `- target: MyindSoundWidgets { embed: true }` dependency above. Not built yet.
  MyindSoundTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MyindSoundTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myindsound.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MyindSound
schemes:
  MyindSound:
    build:
      targets:
        MyindSound: all
        MyindSoundTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-screen library": true
        "-mock": false
    test:
      config: Debug
      targets:
        - MyindSoundTests
